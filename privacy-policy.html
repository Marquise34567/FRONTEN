    <script>
      (function () {
        var GA_ID = "G-PVX6W0EGE5";
        var ADS_CLIENT = "ca-pub-1673409109670744";
        var loaded = false;
        var idleHandle = null;
        window.dataLayer = window.dataLayer || [];
        window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
        window.gtag("js", new Date());

        var appendScript = function (src, withCrossorigin) {
          var script = document.createElement("script");
          script.async = true;
          script.src = src;
          if (withCrossorigin) script.setAttribute("crossorigin", "anonymous");
          document.head.appendChild(script);
        };

        var loadThirdParty = function () {
          if (loaded) return;
          loaded = true;
          appendScript("https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(GA_ID), false);
          window.gtag("config", GA_ID, { transport_type: "beacon" });
          appendScript(
            "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=" + encodeURIComponent(ADS_CLIENT),
            true
          );
          removeListeners();
        };

        var removeListeners = function () {
          window.removeEventListener("pointerdown", loadThirdParty);
          window.removeEventListener("keydown", loadThirdParty);
          window.removeEventListener("scroll", loadThirdParty);
          if (idleHandle !== null && "cancelIdleCallback" in window) {
            window.cancelIdleCallback(idleHandle);
          }
        };

        window.addEventListener("pointerdown", loadThirdParty, { once: true, passive: true });
        window.addEventListener("keydown", loadThirdParty, { once: true });
        window.addEventListener("scroll", loadThirdParty, { once: true, passive: true });
        if ("requestIdleCallback" in window) {
          idleHandle = window.requestIdleCallback(loadThirdParty, { timeout: 4500 });
        } else {
          window.setTimeout(loadThirdParty, 4500);
        }
      })();
    </script>
